<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mission 3</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body>
<div id="siteHeader"></div><main class="wrap">
<section class="mission-hero"><img src="robot.svg" alt="Robot"><div><h2>Mission 3: Robot Delivery</h2><p>Use sequence carefully. Build a list of commands to guide the robot from <strong>S</strong> to <strong>G</strong> without hitting a wall.</p><div class="badgebar"><span class="badge">Focus: sequence</span><span class="badge">100 XP</span></div></div></section>
<section class="card"><h3>Control panel</h3><div class="panel"><strong>Robot starts facing right.</strong><div class="maze"><div class="cell start">S</div><div class="cell"></div><div class="cell wall">#</div><div class="cell"></div><div class="cell"></div><div class="cell wall">#</div><div class="cell"></div><div class="cell wall">#</div><div class="cell"></div><div class="cell wall">#</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell wall">#</div><div class="cell"></div><div class="cell wall">#</div><div class="cell wall">#</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell goal">G</div></div><div class="cmds"><button class="btn alt" onclick="add('F')">Forward</button><button class="btn alt" onclick="add('L')">Turn Left</button><button class="btn alt" onclick="add('R')">Turn Right</button><button class="btn red" onclick="seq=[];draw()">Clear</button><button class="btn green" onclick="runMaze()">Run</button></div><div class="codebox" id="seqbox">No commands yet.</div><div id="fb"></div></div><div class="pager"><a class="btn alt" href="mission2.html">Previous mission</a><a class="btn" href="mission4.html" data-requires="3">Next mission</a></div></section>
</main><div id="siteFooter"></div><script>let seq=[]; function add(c){seq.push(c);draw()} function draw(){document.getElementById('seqbox').textContent=seq.length?seq.join(' → '):'No commands yet.'} function runMaze(){let r=0,c=0,dir=1; const walls=new Set(['0,2','1,0','1,2','1,4','2,4','3,1','3,2']); let crashed=false; for(const cmd of seq){ if(cmd==='L')dir=(dir+3)%4; if(cmd==='R')dir=(dir+1)%4; if(cmd==='F'){ const dr=[-1,0,1,0][dir], dc=[0,1,0,-1][dir]; const nr=r+dr,nc=c+dc; if(nr<0||nr>4||nc<0||nc>4||walls.has(`${nr},${nc}`)){crashed=true;break;} r=nr;c=nc; } } const fb=document.getElementById('fb'); if(!crashed && r===4 && c===4){fqComplete(3); fb.innerHTML=fqCompletePanel(3,'mission4.html');} else if(crashed){fb.innerHTML='<div class="feedback bad">Crash! Adjust the sequence and retest.</div>';} else {fb.innerHTML=`<div class="feedback bad">Robot stopped at row ${r+1}, column ${c+1}. Keep debugging.</div>`;}}</script></body></html>
