<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mission 5</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body>
<div id="siteHeader"></div><main class="wrap">
<section class="mission-hero"><img src="race.svg" alt="Race"><div><h2>Mission 5: Algorithm Race</h2><p>Put the steps of an algorithm into a sensible order. Click the shuffled steps in the correct sequence before the timer reaches zero.</p><div class="badgebar"><span class="badge">Focus: ordering</span><span class="badge">100 XP</span></div></div></section>
<section class="card"><h3>Timed challenge</h3><div class="panel"><div class="timer" id="timer">35</div><p>Goal: create a pass / retry algorithm.</p><div class="choice-list" id="choices"></div><div class="codebox" id="orderbox">Your order: —</div><div id="fb"></div></div><div class="pager"><a class="btn alt" href="mission4.html">Previous mission</a><a class="btn" href="mission6.html" data-requires="5">Next mission</a></div></section>
</main><div id="siteFooter"></div><script>const correct=['START','Input score','Is score ≥ 50?','YES → Print PASS','NO → Print RETRY','END']; let order=[]; let time=35; let timer; function start(){order=[]; time=35; const shuffled=['NO → Print RETRY','END','Input score','YES → Print PASS','START','Is score ≥ 50?']; document.getElementById('choices').innerHTML=shuffled.map(s=>`<button class="choice" onclick="pick(this)">${s}</button>`).join(''); document.getElementById('orderbox').textContent='Your order: —'; document.getElementById('fb').innerHTML=''; clearInterval(timer); timer=setInterval(()=>{time--; document.getElementById('timer').textContent=time; if(time<=0){clearInterval(timer); document.getElementById('fb').innerHTML='<div class="feedback bad">Time up. Refresh the page or try again.</div>'; [...document.querySelectorAll('#choices .choice')].forEach(b=>b.disabled=true);} },1000);} function pick(btn){order.push(btn.textContent); btn.disabled=true; document.getElementById('orderbox').textContent='Your order: '+order.join(' → '); if(order.length===6){clearInterval(timer); if(JSON.stringify(order)===JSON.stringify(correct)){fqComplete(5); document.getElementById('fb').innerHTML=fqCompletePanel(5,'mission6.html');} else {document.getElementById('fb').innerHTML='<div class="feedback bad">Not quite. Think carefully about where the decision belongs and where the two branches go.<br><br><button class="btn alt" onclick="start()">Try again</button></div>';}}} document.addEventListener('DOMContentLoaded',start);</script></body></html>
