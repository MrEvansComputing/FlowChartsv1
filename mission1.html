<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mission 1</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body>
<div id="siteHeader"></div><main class="wrap">
<section class="mission-hero"><img src="symbols.svg" alt="Flowchart symbols"><div><h2>Mission 1: Symbol Scanner</h2><p>Learn the four main flowchart symbols so you can recognise them quickly later. Complete the short quiz to unlock Mission 2.</p><div class="badgebar"><span class="badge">Focus: symbols</span><span class="badge">100 XP</span></div></div></section>
<section class="card"><h3>Quiz</h3><div id="quizPanel" class="panel"></div><div class="pager"><a class="btn alt" href="index.html">Back to map</a><a class="btn" href="mission2.html" data-requires="1">Next mission</a></div></section>
</main><div id="siteFooter"></div>
<script>
const qs=[["Which symbol is normally used for START / END?",["Rectangle","Diamond","Oval / rounded terminator","Parallelogram"],2],["Which symbol is used for a decision?",["Diamond","Rectangle","Oval","Arrow"],0],["Which symbol is usually used for input / output?",["Diamond","Parallelogram","Rectangle","Circle"],1],["Which symbol is normally used for a process or calculation?",["Rectangle","Diamond","Oval","Arrow"],0]];
let qi=0,score=0; function showQ(){const p=document.getElementById('quizPanel'); if(qi>=qs.length){fqComplete(1); p.innerHTML=fqCompletePanel(1,'mission2.html'); return;} const [q,opts,a]=qs[qi]; p.innerHTML=`<strong>${qi+1}/4 — ${q}</strong><div class="choice-list">${opts.map((o,i)=>`<button class="choice" onclick="ans(${i},${a},this)">${o}</button>`).join('')}</div><div id="fb"></div>`;} function ans(i,a,el){[...el.parentElement.children].forEach(b=>b.disabled=true); if(i===a){score++;el.classList.add('correct'); document.getElementById('fb').innerHTML='<div class="feedback good">Correct.</div>';} else {el.classList.add('wrong'); document.getElementById('fb').innerHTML='<div class="feedback bad">Not quite. Think about the purpose of each symbol.</div>';} setTimeout(()=>{qi++;showQ();},900);} document.addEventListener('DOMContentLoaded',showQ);
</script></body></html>
